\* LIVENESS: NoLostRowLive under LiveSpec (fairness on pgpm's steps and on a started statement finishing, Base A10).
\* The detach path, fresh install, every environment group that moves custody (renames included since #1424 released a
\* renamed detached retirement). Not the archive-side groups SG, OC and SB: they move archive coverage, not custody, and
\* Custody.cfg and CustodyFK.cfg keep them. With them, the cache of #1451 took this check from 5.0M states to about 8M,
\* past a CI job's budget; without them it is 1.56M.
\* 2 environment steps per behaviour (Base A9). Target: a full check in under 10 minutes.
SPECIFICATION LiveSpec
