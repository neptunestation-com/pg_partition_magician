name: Test Suite

on:
  # The merge queue builds main plus the queued PRs and runs this on that tree, so a queued
  # change is tested exactly as it will land. merge_group has no paths filter by design.
  merge_group:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per PR head: a rebase or a fix pushed to a PR cancels the superseded head's runs, which is
# what let pass 3's twenty-one fix heads queue about 90 runs behind the runner cap (#644). A push to
# main or a merge group is keyed by its sha, so those never cancel or queue behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per PostgreSQL version AND install channel (psql, bundle, dbdev). The three channels run the
  # same pgTAP files against differently packaged installs and cost the same: measured on a merge group
  # on 2026-10-07, PG15 spent 80 s building its image, then 449, 451 and 447 s on the three channels in
  # turn, 24 minutes in all, which made this matrix the critical path of every merge group (the next
  # longest job, a discriminate shard, took 17). Twelve jobs of about nine minutes cost the same runner
  # minutes as four of 24 and let the queue merge in half the time. `./test.sh <version> --channel=<ch>`
  # runs one channel end to end, its uninstall check included; the Test Summary still needs every cell.
  test:
    name: PostgreSQL ${{ matrix.pg_version }} / ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [15, 16, 17, 18]
        channel: [psql, bundle, dbdev]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test the ${{ matrix.channel }} channel on PostgreSQL ${{ matrix.pg_version }}
        run: ./test.sh ${{ matrix.pg_version }} --channel=${{ matrix.channel }}

  packages:
    name: Build channel packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bundle + dbdev package and verify
        run: |
          # Derived the same way test.sh derives it, so this can't drift from extension.control again.
          VER=$(awk -F"'" '/default_version/ {print $2}' pgpm_core/extension.control)
          DBDEV_PKG="dist/pg_partition_magician--${VER}.sql"
          scripts/build_install_bundle.sh pgpm_core/install.sql dist/pg_partition_magician-bundle.sql
          # The package must build and lex; its SIZE against database.dev's column is the dbdev-cap job's,
          # below, which is deliberately not required for merge.
          PGPM_DBDEV_CAP=warn scripts/build_dbdev_package.sh pgpm_core/install.sql "$DBDEV_PKG"
          # bundle must be free of psql metacommands (dashboard SQL editor target)
          if grep -nE '^\\' dist/pg_partition_magician-bundle.sql "$DBDEV_PKG"; then
            echo "ERROR: a package still contains psql metacommands"; exit 1
          fi

  # database.dev stores a package version's SQL in a varchar(250000) column (supabase/dbdev,
  # supabase/migrations/20220117142137_package_tables.sql); its documentation does not say so, and
  # pg_flight_recorder met the limit by publishing. The minified core install crossed the cap in pass 5's
  # fix phase (2026-10-01, #765), and a fix must not wait on the registry's column, so this job never
  # fails and is NOT in the Test Summary's needs: it builds with PGPM_DBDEV_CAP=warn, writes the size to
  # its job summary, and raises a ::warning:: annotation while the package is over. The publish workflow
  # runs the same build strictly and refuses to publish until it fits. RELEASING.md carries the decision.
  dbdev-cap:
    name: dbdev package size (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report whether the minified package fits database.dev's 250,000-character column
        run: |
          VER=$(awk -F"'" '/default_version/ {print $2}' pgpm_core/extension.control)
          OUT="dist/pg_partition_magician--${VER}.sql"
          PGPM_DBDEV_CAP=warn scripts/build_dbdev_package.sh pgpm_core/install.sql "$OUT" 2>build.err
          cat build.err >&2
          SIZE=$(wc -c < "$OUT" | tr -d ' ')
          {
            echo "### dbdev package size"
            echo
            if grep -q '^WARNING:' build.err; then
              echo ":warning: **${SIZE} characters**, $((SIZE - 250000)) over database.dev's 250,000-character column. The package installs through psql; it cannot be published to database.dev until it is under the cap (#765)."
            else
              echo "${SIZE} characters, $((250000 - SIZE)) under database.dev's 250,000-character column."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^WARNING:' build.err; then
            echo "::warning file=pgpm_core/install.sql,title=dbdev package over the 250,000-character cap::${SIZE} characters minified, $((SIZE - 250000)) over database.dev's column; it installs through psql but cannot be published to database.dev until it is under the cap (#765)"
          fi

  # The from_hypertable / TimescaleDB track, a first-class member of the default suite. It runs on a separate
  # image (Apache TimescaleDB on supabase/postgres, PG15) so it lives in its own reusable workflow rather than
  # the PG-version matrix above; calling it here makes it run on every push/PR alongside the matrix.
  timescale:
    name: TimescaleDB track
    uses: ./.github/workflows/timescale.yml

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, packages, timescale]
    if: always()
    steps:
      - run: |
          [ "${{ needs.test.result }}" = "success" ] || { echo "matrix tests failed"; exit 1; }
          [ "${{ needs.packages.result }}" = "success" ] || { echo "package build failed"; exit 1; }
          [ "${{ needs.timescale.result }}" = "success" ] || { echo "from_hypertable (TimescaleDB) track failed"; exit 1; }
          echo "All tests, the TimescaleDB track, and package builds passed."
