name: Perf guard

# Guards regrain and transmute against DATA-COUPLED LOCKS AND WORK: a blocking lock may last milliseconds, but it must never last
# a duration coupled to data size (issue #263's acceptance rule).
#
# Separate from the pgTAP matrix for two reasons. The lock guards need a SECOND SESSION observing a first
# one mid-operation, and a pgTAP file is one session. The work guards read pg_stat_all_tables scan
# counters, which flush at TRANSACTION END, so the sample has to be taken in a later transaction than the
# work it measures; the harness runs one tick per transaction, which is also how maintain drives it in
# production.
#
# It asserts scan COUNTERS, not wall-clock, so there are no timing thresholds to flake on a shared runner:
# the expected value is exactly zero.
on:
  # The merge queue builds main plus the queued PRs and runs this on that tree, so a queued
  # change is tested exactly as it will land. merge_group has no paths filter by design.
  merge_group:
  # No paths filter: the merge queue requires this workflow's summary on every PR, and a required
  # check that did not run blocks the PR from being queued. Sharded, the whole workflow is about as
  # long as one pgTAP matrix job, so running it on every PR costs runner minutes, not wall-clock.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sharded across runners. One job that ran every guard and then every mutation took 27 minutes and was
# the critical path of every PR's CI (the pgTAP matrix takes 6). `--shard=I/N` is an interleaved slice
# of the same list, chosen by index, so every guard and every mutation runs in exactly one job and no
# guard's environment changes: each still gets its own runner, container and database. A slice that
# would select nothing FAILS rather than passing vacuously (test.sh and bench/discriminate.sh both
# enforce it), so mis-sizing N can only make a job red, never quietly skip a guard.
#
# `./test.sh perf` and `./test.sh discriminate` with no --shard still run everything, which is what
# `./test.sh ci` does locally.
# One run per PR head: a rebase or a fix pushed to a PR cancels the superseded head's runs, which is
# what let pass 3's twenty-one fix heads queue about 90 runs behind the runner cap (#644). A push to
# main or a merge group is keyed by its sha, so those never cancel or queue behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The track names below are written literally, not as a matrix variable: scripts/check_track_filters.py
  # finds a workflow's tracks by reading `./test.sh <track>` out of its run steps, and a templated track
  # makes the whole workflow invisible to that check (it happened while writing this file).
  perf:
    name: data-coupled lock and work guards ${{ matrix.shard }} / PG17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The PG17 image from the Actions cache (test.yml explains the key); on a hit the job neither
      # builds nor pulls, and the shard starts its guards about a minute earlier.
      - name: Restore the PG17 test image from the cache
        id: image
        uses: ./.github/actions/test-image-restore
        with:
          profile: pg17
          service: postgres17
      - name: Run the perf track, shard ${{ matrix.shard }}
        run: ./test.sh perf --shard=${{ matrix.shard }}
      - name: Save the PG17 test image for the cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-image-save
        with:
          cache-hit: ${{ steps.image.outputs.cache-hit }}
          image: ${{ steps.image.outputs.image }}
          key: ${{ steps.image.outputs.key }}
          cache-key: ${{ steps.image.outputs.cache-key }}
          tarball: ${{ steps.image.outputs.tarball }}

  # Every guard is green on correct code. That alone does not show any of them would notice a
  # regression, and this repo has repeatedly produced guards that pass while observing nothing. These
  # rebuild install.sql with each defect put back and require the matching guard to FAIL.
  #
  # Every shard brings up the archive profile (run_discriminate needs its pgsql-http image for the
  # archive-scoped mutations), and with it MinIO, which comes from Docker Hub anonymously. Four shards
  # per PR, times a burst of PRs, is the shape of traffic that spent ECR Public's anonymous DATA quota
  # on 2026-09-26 (#558): a quota, unlike a rate limit, does not clear within any backoff a job can afford.
  # So the MinIO image is restored from the Actions cache, keyed on its digest reference, and test.sh
  # skips the pull of an image that is already present: a hit never calls Docker Hub. A miss pulls as
  # before and saves the image afterwards, pass or fail. archive.yml carries the same steps and the
  # same key, so either workflow's save serves both.
  #
  # Six shards, over a listing bench/mutations/mutate.py prints heaviest first (MUTATION_COST there):
  # with four shards over the catalogue's own order the slowest took 17 minutes, the critical path of
  # a merge group once the pgTAP matrix was split by channel, because the 240 s lz77 probe and the two
  # 100 s deflate probes shared a shard; heavy-first over six, the slowest is about 11 (measured and
  # simulated on the pr-1029 group, 2026-10-07). Both images the track builds (pgpm_test:17 and the
  # pgsql-http one) come from the Actions cache under scripts/image_build_key.sh's key, as test.yml's.
  discriminate:
    name: guards discriminate ${{ matrix.shard }} / PG17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Restore the PG17 test image from the cache
        id: image
        uses: ./.github/actions/test-image-restore
        with:
          profile: pg17
          service: postgres17
      - name: Restore the archive test image from the cache
        id: image-archive
        uses: ./.github/actions/test-image-restore
        with:
          profile: archive
          service: archive
      # MinIO from the Actions cache rather than Docker Hub (see the comment on this job). The reference
      # is read from docker-compose.yml, never restated here, and the cached copy is the digest-pulled
      # image under the local tag pgpm-cache/minio:<digest hex>: the runners' classic image store drops
      # digests on `docker save`, so a loaded copy could never answer to the digest reference itself
      # (docker-compose.yml explains PGPM_MINIO_IMAGE, which points compose at that tag on a hit).
      - name: Resolve the MinIO image reference
        id: minio
        run: |
          ref=$(docker compose --profile archive config --images minio)
          case "$ref" in
            *@sha256:*) ;;
            *) echo "::error::the MinIO image is no longer pinned by digest ($ref); the cache keys on the digest"; exit 1 ;;
          esac
          {
            echo "ref=$ref"
            echo "alias=pgpm-cache/minio:${ref##*@sha256:}"
            echo "key=third-party-image-v1-${RUNNER_OS}-${RUNNER_ARCH}-$ref"
            echo "tarball=$RUNNER_TEMP/third-party-images/minio.tar"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the MinIO image from the cache
        id: minio-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.minio.outputs.tarball }}
          key: ${{ steps.minio.outputs.key }}
      - name: Load the cached MinIO image
        if: steps.minio-cache.outputs.cache-hit == 'true'
        env:
          ALIAS: ${{ steps.minio.outputs.alias }}
          TARBALL: ${{ steps.minio.outputs.tarball }}
        run: |
          docker load -i "$TARBALL"
          # Witness: the tag compose will be pointed at answers locally, so test.sh does not pull.
          docker image inspect "$ALIAS" >/dev/null
          echo "PGPM_MINIO_IMAGE=$ALIAS" >> "$GITHUB_ENV"
      - name: Prove the guards discriminate, shard ${{ matrix.shard }}
        run: ./test.sh discriminate --shard=${{ matrix.shard }}
      # On a miss, after the track whatever its result, and only if the digest-pinned image was pulled.
      - name: Save the MinIO image for the cache
        id: minio-save
        if: ${{ !cancelled() && steps.minio-cache.outputs.cache-hit != 'true' }}
        env:
          REF: ${{ steps.minio.outputs.ref }}
          ALIAS: ${{ steps.minio.outputs.alias }}
          TARBALL: ${{ steps.minio.outputs.tarball }}
        run: |
          if [ -z "$REF" ] || ! docker image inspect "$REF" >/dev/null 2>&1; then
            echo "the MinIO image was never pulled; nothing to cache"; exit 0
          fi
          mkdir -p "$(dirname "$TARBALL")"
          docker tag "$REF" "$ALIAS"
          docker save -o "$TARBALL" "$ALIAS"
          echo "saved=true" >> "$GITHUB_OUTPUT"
      - name: Store the MinIO image in the cache
        if: ${{ !cancelled() && steps.minio-save.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.minio.outputs.tarball }}
          key: ${{ steps.minio.outputs.key }}
      - name: Save the PG17 test image for the cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-image-save
        with:
          cache-hit: ${{ steps.image.outputs.cache-hit }}
          image: ${{ steps.image.outputs.image }}
          key: ${{ steps.image.outputs.key }}
          cache-key: ${{ steps.image.outputs.cache-key }}
          tarball: ${{ steps.image.outputs.tarball }}
      - name: Save the archive test image for the cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-image-save
        with:
          cache-hit: ${{ steps.image-archive.outputs.cache-hit }}
          image: ${{ steps.image-archive.outputs.image }}
          key: ${{ steps.image-archive.outputs.key }}
          cache-key: ${{ steps.image-archive.outputs.cache-key }}
          tarball: ${{ steps.image-archive.outputs.tarball }}

  # One stable name for the merge queue and branch protection to require, whatever the shard count.
  summary:
    name: Perf summary
    runs-on: ubuntu-latest
    needs: [perf, discriminate]
    if: always()
    steps:
      - run: |
          [ "${{ needs.perf.result }}" = "success" ] || { echo "a perf shard failed"; exit 1; }
          [ "${{ needs.discriminate.result }}" = "success" ] || { echo "a discriminate shard failed"; exit 1; }
          echo "Every guard passed on correct code and failed against its own defect."
